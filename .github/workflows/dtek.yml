name: DTEK графік

on:
  schedule:
    - cron: "*/30 * * * *"   # кожні 30 хв
  workflow_dispatch:          # кнопка ручного запуску

permissions:
  contents: write

concurrency:
  group: dtek
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Встановити браузер і віртуальний екран
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m playwright install --with-deps chromium

      # cookies після проходження захисту сайту — щоб наступного разу пускало легше
      - uses: actions/cache@v5
        with:
          path: .cache
          key: browser-state-${{ github.run_id }}
          restore-keys: browser-state-

      - name: Перевірити графік
        run: xvfb-run -a python dtek_notify.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROUP: "5.2"
          DAILY_HOUR: "7"
          HEADFUL: "1"

      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
